services:
  postgres:
    image: postgres:16-alpine
    container_name: mafia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mafia}
      POSTGRES_USER: ${POSTGRES_USER:-mafia_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mafia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mafia_app} -d ${POSTGRES_DB:-mafia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mafia_postgres_data:
